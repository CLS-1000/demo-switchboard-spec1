<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="copyright" content="EVASTARARCANA LLC"><title>SWITCHBOARD - LIVE Citizen Cognisance</title>
<style>
:root{--bg:#000;--surface:#0A0A0A;--border:#FFF;--text:#FFF;--muted:#888;--accent:#F26A1B;--mono:'IBM Plex Mono','Courier Prime',ui-monospace,monospace}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:var(--mono);font-size:14px;line-height:1.5;padding:24px}
h1{font-size:20px;letter-spacing:.08em;margin:0 0 4px}.sub{color:var(--muted);font-size:11px;letter-spacing:.12em;margin-bottom:20px}
.bar{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}.bar input{flex:1;min-width:240px;background:#000;border:1px solid var(--border);color:var(--text);font-family:var(--mono);padding:10px 12px}
.bar select{background:#000;border:1px solid var(--border);color:var(--text);font-family:var(--mono);padding:10px 12px}.bar button{background:transparent;border:1px solid var(--border);color:var(--text);font-family:var(--mono);padding:10px 18px;cursor:pointer}
.bar button:hover{background:var(--border);color:#000}
.panel{border:1px solid var(--border);padding:16px;margin-bottom:16px}.panel h2{font-size:13px;letter-spacing:.1em;margin:0 0 12px;color:var(--accent)}
.kv{border-top:1px solid #1a1a1a;padding:8px 0;font-size:13px}.k{color:var(--muted)}.v{color:var(--text)}
.note{color:var(--muted);font-size:12px}.ok{color:#22c55e}.bad{color:#ef4444}
</style></head><body>
<h1>SWITCHBOARD</h1><div class="sub">LIVE CITIZEN COGNISANCE - SPEC-1 /nodes/{id}/signal</div>
<div class="bar"><input id="base" value="http://localhost:8000/api/v1" spellcheck="false">
<select id="node"></select><button id="load">QUERY NODE</button></div>
<div id="status" class="note">Pick a Portland node, set API base, ensure SPEC-1 running with CORS, then Query.</div>
<div class="panel"><h2>NODE SIGNAL</h2><div id="out"></div></div>
<script>
const NODES=["wilson","city_admin","auditor","pirtle","clark","avalos","dunphy","lsmith","kanal","ryan","koyama","morillo","novick","green","zimmerman","peacock","vega","county","metro","kotek","ore_leg","homelessness","housing","budget","charter","rcv","police","ethics","business_tax","pba","psr","fire_bds","irp","lwv"];
const $=id=>document.getElementById(id);
const base=()=>$('base').value.replace(/\/$/,'');
NODES.forEach(n=>{const o=document.createElement('option');o.value=n;o.textContent=n;$('node').appendChild(o);});
function setStatus(t,c){$('status').textContent=t;if(c)$('status').className=c;}
function kv(o){let h='';for(const[k,v]of Object.entries(o)){if(v&&typeof v==='object'){h+='<div class="kv"><span class="k">'+k+':</span></div>'+kv(v);}else{h+='<div class="kv"><span class="k">'+k+':</span> <span class="v">'+esc(String(v))+'</span></div>';}}return h;}
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
$('load').addEventListener('click',async()=>{const id=$('node').value;setStatus('Fetching /nodes/'+id+'/signal ...');try{const r=await fetch(base()+'/nodes/'+encodeURIComponent(id)+'/signal');if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json();$('out').innerHTML=j&&typeof j==='object'?kv(j):'<div class="note">'+esc(JSON.stringify(j))+'</div>';setStatus((j.stale?'STALE ':'')+'signal for '+id+'.','ok');}catch(e){setStatus('Could not reach API: '+e.message,'bad');}});
</script></body></html>
