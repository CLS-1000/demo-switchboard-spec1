<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="copyright" content="EVASTARARCANA LLC">
<title>SWITCHBOARD - LIVE Triage Desk</title>
<style>
:root{--bg:#000;--surface:#0A0A0A;--border:#FFF;--text:#FFF;--muted:#888;--accent:#F26A1B;--mono:'IBM Plex Mono','Courier Prime',ui-monospace,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--mono);font-size:14px;line-height:1.5;padding:24px}
h1{font-size:20px;letter-spacing:.08em;margin:0 0 4px}
.sub{color:var(--muted);font-size:11px;letter-spacing:.12em;margin-bottom:20px}
.bar{display:flex;gap:8px;align-items:center;margin-bottom:20px;flex-wrap:wrap}
input{flex:1;min-width:280px;background:#000;border:1px solid var(--border);color:var(--text);font-family:var(--mono);padding:10px 12px}
button{background:transparent;border:1px solid var(--border);color:var(--text);font-family:var(--mono);letter-spacing:.08em;padding:10px 18px;cursor:pointer}
button:hover{background:var(--border);color:#000}
.panel{border:1px solid var(--border);padding:16px;margin-bottom:16px}
.panel h2{font-size:13px;letter-spacing:.1em;margin:0 0 12px;color:var(--accent)}
.run{border:1px solid #333;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.run:hover{border-color:var(--accent)}
.run .id{color:var(--accent)} .run .meta{color:var(--muted);font-size:12px}
.rec{border-top:1px solid #1a1a1a;padding:10px 0;font-size:13px}
.rec .k{color:var(--muted)}
.rec .v{color:var(--text)}
.ok{color:#22c55e}.warn{color:#EAB308}.bad{color:#ef4444}
.note{color:var(--muted);font-size:12px}
</style>
</head>
<body>
<h1>SWITCHBOARD</h1>
<div class="sub">LIVE TRIAGE DESK - queries the SPEC-1 FastAPI at /api/v1</div>
<div class="bar">
  <input id="base" value="http://localhost:8000/api/v1" spellcheck="false">
  <button id="load">LOAD RUNS</button>
</div>
<div id="status" class="note">Set the API base (default http://localhost:8000/api/v1), ensure SPEC-1 is running with CORS allowed, then Load Runs.</div>
<div class="panel"><h2>RUNS</h2><div id="runs"></div></div>
<div class="panel"><h2>RECORDS</h2><div id="records"></div></div>

<script>
const $ = id => document.getElementById(id);
function base(){ return $('base').value.replace(/\/$/,''); }
function setStatus(t,cls){ $('status').textContent = t; if(cls) $('status').className = cls; }

async function loadRuns(){
  setStatus('Fetching /runs ...');
  try{
    const r = await fetch(base()+'/runs?limit=50');
    if(!r.ok) throw new Error('HTTP '+r.status);
    const j = await r.json();
    const runs = Array.isArray(j) ? j : (j.runs || []);
    $('runs').innerHTML = runs.length ? runs.map(runRow).join('') : '<div class="note">No runs returned.</div>';
    setStatus('Loaded '+runs.length+' run(s). Click a run to fetch its records.', 'ok');
  }catch(e){ setStatus('Could not reach API: '+e.message+'  (is SPEC-1 running? CORS enabled?)', 'bad'); }
}
function runRow(run){
  const id = run.run_id || run.id || '(unknown)';
  const meta = [run.timestamp, run.environment, run.record_count!=null?run.record_count+' records':''].filter(Boolean).join(' · ');
  return '<div class="run" data-id="'+id+'"><span class="id">'+id+'</span> <span class="meta">'+meta+'</span></div>';
}
$('runs').addEventListener('click', e=>{
  const el = e.target.closest('.run'); if(!el) return; loadRecords(el.dataset.id);
});
async function loadRecords(runId){
  setStatus('Fetching /runs/'+runId+'/records ...');
  try{
    const r = await fetch(base()+'/runs/'+encodeURIComponent(runId)+'/records?limit=200');
    if(!r.ok) throw new Error('HTTP '+r.status);
    const j = await r.json();
    const recs = Array.isArray(j) ? j : (j.records || []);
    $('records').innerHTML = '<div class="note">'+recs.length+' record(s) in '+runId+'</div>' + recs.map(recRow).join('');
    setStatus('Loaded '+recs.length+' record(s) for '+runId+'.', 'ok');
  }catch(e){ setStatus('Could not fetch records: '+e.message, 'bad'); }
}
function recRow(rec){
  const fields = [['classification','cls'],['analysis_tier','tier'],['gate_status','gate'],['source','src'],['confidence','conf'],['signal_source','src2'],['opportunity_priority','prio']];
  const rows = fields.map(([k,l])=> rec[k]!=null ? '<span class="k">'+l+':</span> <span class="v">'+escape(String(rec[k]))+'</span>  ' : '').join('');
  const excerpt = rec.signal_excerpt || rec.excerpt || rec.hypothesis || '';
  return '<div class="rec">'+rows+(excerpt?'<div class="note" style="margin-top:6px">'+escape(String(excerpt).slice(0,300))+'</div>':'')+'</div>';
}
function escape(s){ return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
$('load').addEventListener('click', loadRuns);
</script>
</body>
</html>
